<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>裴盛清</title>
<meta name="description" content="裴盛清的个人主页：玉溪，小红书「千年等待」，写科普问答与生活感悟。">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #f6f1e7;
    color: #26221c;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 680px; margin: 0 auto; padding: 0 24px 64px; }

  /* hero */
  header { position: relative; padding: 72px 0 40px; }
  .seal { position: absolute; top: 56px; right: 0; width: 96px; height: auto; opacity: .92; }
  .eyebrow { font-size: 13px; letter-spacing: 4px; color: #a39a86; }
  h1 {
    margin-top: 14px;
    font-family: "Songti SC", "STSong", "Noto Serif CJK SC", "Noto Serif SC", serif;
    font-size: 58px; font-weight: 700; letter-spacing: 8px; line-height: 1.15;
  }
  .intro { margin-top: 18px; font-size: 16px; line-height: 1.9; color: #57503f; max-width: 460px; }
  .rule { margin-top: 36px; display: flex; align-items: center; gap: 12px; color: #c9bfa6; }
  .rule::before, .rule::after { content: ""; flex: 1; height: 1px; background: #e2d9c2; }
  .rule span { font-size: 12px; color: #a39a86; letter-spacing: 2px; }

  /* cards */
  .cards { margin-top: 8px; display: flex; flex-direction: column; gap: 14px; }
  .card {
    display: flex; align-items: center; gap: 16px;
    background: #fffdf7;
    border: 1px solid #e7ddc6; border-radius: 14px;
    padding: 20px 22px; text-decoration: none; color: inherit;
    transition: border-color .2s, transform .2s;
  }
  .card:hover { border-color: #c2410c; transform: translateY(-1px); }
  .card .icon {
    flex: none; width: 46px; height: 46px; border-radius: 12px;
    background: #f3ead6; color: #b3402a;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-family: "Songti SC", serif;
  }
  .card .body { flex: 1; min-width: 0; }
  .card h2 { font-size: 17px; font-weight: 700; }
  .card h2 .tag {
    margin-left: 8px; padding: 2px 8px; border-radius: 20px;
    background: #fbe9e2; color: #b3402a; font-size: 12px; font-weight: 600;
    vertical-align: 2px; letter-spacing: 0;
  }
  .card p { margin-top: 5px; font-size: 14px; line-height: 1.6; color: #7a7264; }
  .card .arrow { flex: none; font-size: 20px; color: #c9bfa6; }


  /* gallery */
  .gallery { margin-top: 40px; }
  .gallery h3 { font-size: 13px; letter-spacing: 3px; color: #a39a86; font-weight: 600; }
  .gallery .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 12px; }
  .gallery a { display: block; text-decoration: none; color: inherit; }
  .gallery img { width: 100%; aspect-ratio: 3 / 2; object-fit: cover; border-radius: 12px; border: 1px solid #e7ddc6; display: block; }
  .gallery span { display: block; margin-top: 7px; font-size: 13px; color: #7a7264; text-align: center; }

  /* latest note */
  .latest { margin-top: 40px; }
  .latest h3 { font-size: 13px; letter-spacing: 3px; color: #a39a86; font-weight: 600; }
  .latest a {
    display: block; margin-top: 12px; padding: 18px 22px;
    background: #fffdf7; border: 1px solid #e7ddc6; border-radius: 14px;
    text-decoration: none; color: inherit;
  }
  .latest a:hover { border-color: #c2410c; }
  .latest .title { font-family: "Songti SC", "STSong", serif; font-size: 19px; font-weight: 700; line-height: 1.5; }
  .latest .meta { margin-top: 8px; font-size: 13px; color: #a39a86; }

  footer { margin-top: 48px; text-align: center; font-size: 13px; color: #a39a86; letter-spacing: 1px; }
  footer .dot { margin: 0 8px; color: #d8cfb8; }

  @media (max-width: 480px) {
    header { padding-top: 56px; }
    .seal { width: 76px; top: 48px; }
    h1 { font-size: 46px; }
    .intro { font-size: 15px; }
  }
</style>
</head>
